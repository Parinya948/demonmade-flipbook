<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Demonmade</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --gold:      #c9a96e;
  --gold-light:#e8d5a3;
  --dark:      #0d0d0f;
}

html, body {
  height: 100%;
  background: var(--dark);
  font-family: 'Cormorant Garamond', serif;
  overflow: hidden; /* ป้องกัน scroll กระตุก */
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  color: rgba(232,213,163,0.85);
}

/* ambient glow */
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 60% 40% at 50% 100%, rgba(201,169,110,.08) 0%, transparent 70%),
    radial-gradient(ellipse 40% 30% at 20%   0%, rgba(201,169,110,.04) 0%, transparent 60%);
  pointer-events: none; z-index: 0;
}
body::after {
  content: '';
  position: fixed; top:0; left:0; right:0; height:1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  z-index: 999;
}

/* ── Header ── */
header {
  position: relative; z-index: 10;
  width: 100%; padding: 12px 24px;
  background: rgba(13,13,15,.9);
  backdrop-filter: blur(12px);
  display: flex; align-items: center; justify-content: center;
  border-bottom: 1px solid rgba(201,169,110,.1);
  flex-shrink: 0;
}
.logo {
  font-size: 1rem; font-weight: 600;
  letter-spacing: 4px; text-transform: uppercase;
  color: var(--gold);
}
.logo span { color: rgba(232,213,163,.4); font-weight: 300; }

/* ── Loading ── */
#screen-loading {
  position: fixed; inset: 0; z-index: 100;
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 20px;
  background: var(--dark);
}
.prog-ring { width: 44px; height: 44px; position: relative; }
.prog-ring::before, .prog-ring::after {
  content: ''; position: absolute; inset: 0;
  border-radius: 50%; border: 1px solid transparent;
}
.prog-ring::before { border-top-color: var(--gold); animation: spin 1.2s linear infinite; }
.prog-ring::after  { border-bottom-color: rgba(201,169,110,.2); animation: spin 1.2s linear infinite reverse; }
@keyframes spin { to { transform: rotate(360deg); } }

#prog-label {
  font-size: .7rem; letter-spacing: 3px; text-transform: uppercase;
  color: rgba(201,169,110,.45); font-weight: 300;
}
#prog-track {
  width: min(320px, 80vw); height: 1px;
  background: rgba(201,169,110,.1);
}
#prog-bar { height: 100%; width: 0%; background: var(--gold); transition: width .15s; }

/* ── Error ── */
#screen-error {
  display: none; position: fixed; inset: 0; z-index: 100;
  align-items: center; justify-content: center;
  background: var(--dark);
}
#screen-error p {
  font-size: .85rem; color: rgba(255,120,120,.7);
  letter-spacing: 1.5px; text-align: center; line-height: 2;
}

/* ── Viewer ── */
#screen-viewer {
  display: none;
  flex-direction: column; align-items: center;
  flex: 1; width: 100%;
  position: relative; z-index: 2;
  overflow: visible; /* ต้อง visible เพื่อให้กระดาษพับออกนอกกรอบได้ */
}

/* ── Book ── */
#book-wrap {
  flex: 1;
  display: flex; align-items: center; justify-content: center;
  width: 100%;
  padding: 16px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  perspective: 1800px;
  perspective-origin: 50% 50%;
  overflow: visible; /* อนุญาตให้กระดาษพับเกินกรอบ */
}

#book-frame {
  padding: 12px;
  background: linear-gradient(145deg, #1c1c24, #111118);
  border: 1px solid rgba(201,169,110,.18);
  position: relative;
  transform-style: preserve-3d;
  overflow: visible; /* กระดาษพับออกนอกกรอบหนังสือได้ */
  box-shadow:
    0 0 0 1px rgba(0,0,0,.8),
    0 24px 80px rgba(0,0,0,.98),
    0 8px 30px rgba(0,0,0,.8),
    0 0 120px rgba(201,169,110,.06),
    inset 0 1px 0 rgba(255,255,255,.04);
  /* subtle 3D tilt — ดูมีความลึกตลอดเวลา */
  transform: rotateX(2deg);
  transition: transform .3s ease;
}
#book-frame:hover {
  transform: rotateX(1deg);
}
#book-frame::before, #book-frame::after {
  content: ''; position: absolute;
  width: 12px; height: 12px;
  border-color: var(--gold); border-style: solid; opacity: .35;
}
#book-frame::before { top:5px; left:5px; border-width:1px 0 0 1px; }
#book-frame::after  { bottom:5px; right:5px; border-width:0 1px 1px 0; }

/* turn.js container — ต้อง visible เพื่อให้กระดาษพับออกนอกกรอบ */
#flipbook {
  overflow: visible !important;
}

/* turn.js pages */
#flipbook .page {
  background: #fff; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}

/* turn.js fold layers ต้องออกนอกขอบได้ */
#flipbook .turn-page-wrapper,
#flipbook .turn-page {
  overflow: visible !important;
}
#flipbook .page canvas { width:100%; height:100%; display:block; }
#flipbook .page .spin {
  width:28px; height:28px; border:2px solid #ddd;
  border-top-color: var(--gold); border-radius:50%;
  animation: spin .9s linear infinite;
}

/* ── Controls bar ── */
#controls {
  flex-shrink: 0;
  display: flex; align-items: center;
  width: 100%;
  background: rgba(10,10,12,.92);
  backdrop-filter: blur(12px);
  border-top: 1px solid rgba(201,169,110,.1);
}

/* page info — ใหญ่เด่น ตรงกลาง */
#pg-info {
  flex: 1; text-align: center;
  font-size: .85rem; letter-spacing: 2px;
  color: rgba(201,169,110,.7); font-weight: 300;
}

.ctrl {
  background: transparent; border: none;
  color: rgba(201,169,110,.5);
  padding: 14px 20px;
  font-family: 'Cormorant Garamond', serif;
  font-size: .72rem; font-weight: 600;
  letter-spacing: 2px; text-transform: uppercase;
  cursor: pointer;
  transition: background .15s, color .15s;
  white-space: nowrap;
}
.ctrl:hover:not(:disabled) { background: rgba(201,169,110,.06); color: var(--gold-light); }
.ctrl:disabled { opacity: .15; cursor: default; }


/* ── Zoom overlay ── */
#zoom-wrap {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,.95); z-index:500;
  align-items:center; justify-content:center;
}
#zoom-wrap.show { display:flex; }
#zoom-canvas {
  max-width:94vw; max-height:94vh;
  box-shadow: 0 12px 60px rgba(0,0,0,.9);
  border: 1px solid rgba(201,169,110,.1);
}
#zoom-x {
  position:absolute; top:16px; right:16px;
  background: rgba(13,13,15,.8); backdrop-filter:blur(8px);
  border: 1px solid rgba(201,169,110,.25);
  width:36px; height:36px; color: var(--gold);
  font-size:1rem; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
#zoom-x:hover { background: rgba(201,169,110,.1); }

@media(max-width:520px){
  .ctrl { padding:12px 12px; font-size:.65rem; letter-spacing:1px; }
  #pg-info { font-size:.75rem; }
}
</style>
</head>
<body>

<header>
  <div class="logo">Demon<span>made</span></div>
</header>

<!-- Loading -->
<div id="screen-loading">
  <div class="prog-ring"></div>
  <p id="prog-label">Loading</p>
  <div id="prog-track"><div id="prog-bar"></div></div>
</div>

<!-- Error -->
<div id="screen-error">
  <p id="err-msg">ไม่พบไฟล์ book.pdf</p>
</div>

<!-- Viewer -->
<div id="screen-viewer">
  <div id="book-wrap">
    <div id="book-frame">
      <div id="flipbook"></div>
    </div>
  </div>

  <div id="controls">
    <button class="ctrl" id="btn-first" onclick="gotoPage(1)" title="หน้าแรก">&#9664;&#9664;</button>
    <button class="ctrl" id="btn-prev"  onclick="flipPrev()">&#8592; Prev</button>
    <span id="pg-info">— / —</span>
    <button class="ctrl" id="btn-next"  onclick="flipNext()">Next &#8594;</button>
    <button class="ctrl" id="btn-last"  onclick="gotoPage(9999)" title="หน้าสุดท้าย">&#9654;&#9654;</button>
  </div>
</div>

<!-- Zoom -->
<div id="zoom-wrap">
  <button id="zoom-x" onclick="closeZoom()">✕</button>
  <canvas id="zoom-canvas"></canvas>
</div>

<script src="jquery.js"></script>
<script src="turn.js"></script>
<script src="pdf.min.js"></script>
<script>
// ── Config ────────────────────────────────────────────────────────────────────
const WORKER_URL = 'pdf.worker.min.js';
const BOOK_FILE  = 'book.pdf';

// ── State ─────────────────────────────────────────────────────────────────────
let pdfDoc = null, totalPages = 0;
let BOOK_W = 0, BOOK_H = 0, PAGE_W = 0, PAGE_H = 0;
let renderQueue = [], rendering = false, bgIdx = 1;

// ── Boot ──────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  pdfjsLib.GlobalWorkerOptions.workerSrc = new URL(WORKER_URL, document.baseURI).href;
  loadBook(BOOK_FILE);
});

async function loadBook(url) {
  show('loading'); setProgress('กำลังโหลด…', 5);
  try {
    const task = pdfjsLib.getDocument({ url });
    task.onProgress = p => { if (p.total) setProgress('', 5 + (p.loaded / p.total) * 75); };
    pdfDoc      = await task.promise;
    totalPages  = pdfDoc.numPages;
    setProgress('', 85);
    await calcSize();
    buildFlipbook();
    show('viewer');
    renderBatch(1, 10); // โหลด 10 หน้าแรกทันที
  } catch (e) {
    show('error');
    document.getElementById('err-msg').textContent =
      'ไม่สามารถโหลด book.pdf ได้\n' + e.message;
  }
}

// ── Sizing ────────────────────────────────────────────────────────────────────
const MOBILE_BP = 640; // px — ต่ำกว่านี้ถือเป็นมือถือ

function isMobile() { return window.innerWidth < MOBILE_BP; }

async function calcSize() {
  const page  = await pdfDoc.getPage(1);
  const vp    = page.getViewport({ scale: 1 });
  const ratio = vp.height / vp.width;
  const hdr   = document.querySelector('header').offsetHeight;
  const ctrl  = 52;
  const vw    = window.innerWidth  - 24;
  const vh    = window.innerHeight - hdr - ctrl - 24;

  if (isMobile()) {
    // มือถือ: ทีละ 1 หน้า กว้าง 85% จอ
    PAGE_W = Math.round(Math.min(vw * 0.85, vh / ratio));
    PAGE_H = Math.round(PAGE_W * ratio);
    BOOK_W = PAGE_W;   // single-page width
    BOOK_H = PAGE_H;
  } else {
    // desktop: 2 หน้าคู่กัน
    PAGE_W = Math.round(Math.min(vw * 0.44, vh / ratio, 580));
    PAGE_H = Math.round(PAGE_W * ratio);
    BOOK_W = PAGE_W * 2;
    BOOK_H = PAGE_H;
  }
}

// ── Build flipbook ────────────────────────────────────────────────────────────
function buildFlipbook() {
  const fb = $('#flipbook');
  if (fb.data('turn')) { try { fb.turn('destroy'); } catch (e) {} }
  fb.empty(); bgIdx = 1; renderQueue = [];

  for (let i = 1; i <= totalPages; i++) {
    fb.append(`<div id="p${i}" class="page${i===1?' cover':''}">` +
              `<div class="spin"></div></div>`);
  }

  fb.turn({
    width:       BOOK_W,
    height:      BOOK_H,
    display:     isMobile() ? 'single' : 'double',
    autoCenter:  true,
    gradients:   true,
    elevation:   150,                       // เงา 3D ลึกขึ้น
    cornerSize:  Math.max(PAGE_W, PAGE_H), // ทั้งหน้าเป็น fold zone
    turnCorners: 'tl,tr,bl,br',
    when: {
      turning: (e, page) => { updateUI(page); renderBatch(page + 1, 8); },
      turned:  (e, page) => { updateUI(page); }
    }
  });

  // overlay คลุมทับอยู่แล้ว — ไม่ต้อง disable turn.js (ไม่งั้น animation ไม่ทำงาน)
  $(window).off('resize.fb').on('resize.fb', debounce(rebuildOnResize, 350));
  setTimeout(() => updateUI(fb.turn('page') || 1), 50);
  setupZoom();
}

// ── Navigation ────────────────────────────────────────────────────────────────
function flipNext() {
  try { $('#flipbook').turn('next'); } catch(e) {}
}
function flipPrev() {
  try { $('#flipbook').turn('previous'); } catch(e) {}
}
function gotoPage(p) {
  try {
    const fb = $('#flipbook');
    const total = fb.turn('pages');
    fb.turn('page', p >= 9999 ? total : Math.max(1, p));
  } catch(e) {}
}

// ── Update UI (page number + button states) ───────────────────────────────────
function updateUI(page) {
  let total = 0;
  try {
    const fb = $('#flipbook');
    total = fb.turn('pages');
  } catch(e) { return; }
  if (!total) return;

  // แสดงเลขหน้า
  let txt;
  if (isMobile()) {
    txt = `${page} / ${total}`;
  } else {
    const lo = page;
    const hi = Math.min(lo + 1, total);
    txt = lo === hi ? `${lo} / ${total}` : `${lo} – ${hi} / ${total}`;
  }
  document.getElementById('pg-info').textContent = txt;

  document.getElementById('btn-prev').disabled  = page <= 1;
  document.getElementById('btn-first').disabled = page <= 1;
  document.getElementById('btn-next').disabled  = page >= total;
  document.getElementById('btn-last').disabled  = page >= total;
}

// ── Tap + Swipe → flip page ───────────────────────────────────────────────────
// turn.js จัดการ drag-fold เอง (cornerSize = full page)
// handler นี้ดูแล: (1) tap = click เปลี่ยนหน้า  (2) swipe ซ้าย/ขวา เปลี่ยนหน้า
(function () {
  const SWIPE_MIN   = 40;  // px — ขยับแนวนอนเกินนี้ = swipe
  const CLICK_MAX   = 10;  // px — ขยับน้อยกว่านี้   = tap/click
  const SWIPE_RATIO = 1.2; // |dx| ต้องมากกว่า |dy| * ratio เพื่อกัน scroll แนวตั้ง

  let startX = null, startY = null, swiped = false;

  function isOnBook(x, y) {
    const el = document.getElementById('flipbook');
    if (!el) return false;
    const r = el.getBoundingClientRect();
    return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
  }

  function onStart(x, y) {
    if (!isOnBook(x, y)) return;
    startX = x; startY = y; swiped = false;
  }

  // ระหว่างลาก — ตรวจ swipe ก่อนที่ touchend จะมา
  function onMove(x, y) {
    if (startX === null || swiped) return;
    const dx = x - startX, dy = y - startY;
    if (Math.abs(dx) >= SWIPE_MIN && Math.abs(dx) > Math.abs(dy) * SWIPE_RATIO) {
      swiped = true;
      dx < 0 ? flipNext() : flipPrev();
    }
  }

  function onEnd(x, y) {
    if (startX === null) return;
    const dx = x - startX, dy = y - startY;
    const dist = Math.hypot(dx, dy);
    startX = null; startY = null;

    if (swiped) return; // swipe handled in onMove

    // tap (ขยับน้อย)
    if (dist <= CLICK_MAX) {
      const r = document.getElementById('flipbook').getBoundingClientRect();
      x < r.left + r.width / 2 ? flipPrev() : flipNext();
    }
    // drag ขนาดกลาง-ใหญ่ → turn.js จัดการ fold อยู่แล้ว ไม่ต้องทำอะไร
  }

  // Touch
  document.addEventListener('touchstart', e => onStart(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
  document.addEventListener('touchmove',  e => onMove(e.touches[0].clientX,  e.touches[0].clientY), { passive: true });
  document.addEventListener('touchend',   e => onEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY), { passive: true });

  // Mouse
  document.addEventListener('mousedown', e => onStart(e.clientX, e.clientY), true);
  document.addEventListener('mousemove', e => onMove(e.clientX,  e.clientY),  true);
  document.addEventListener('mouseup',   e => onEnd(e.clientX,   e.clientY),  true);
})();

// ── Keyboard ──────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (!$('#flipbook').data('turn')) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); flipNext(); }
  if (e.key === 'ArrowLeft'  || e.key === 'PageUp')   { e.preventDefault(); flipPrev(); }
  if (e.key === 'Home') { e.preventDefault(); gotoPage(1); }
  if (e.key === 'End')  { e.preventDefault(); gotoPage(9999); }
});

// ── Render queue — parallel 4 lanes ──────────────────────────────────────────
const MAX_LANES = 4;   // render 4 หน้าพร้อมกัน
let activeLanes = 0;
const inQueue   = new Set();

function renderBatch(from, count = 8) {
  for (let i = from; i < from + count && i <= totalPages; i++) enqueue(i, true);
  pumpQueue();
}

function enqueue(n, priority = false) {
  if (n < 1 || n > totalPages) return;
  const slot = document.getElementById(`p${n}`);
  if (!slot || slot.dataset.rendered || inQueue.has(n)) return;
  inQueue.add(n);
  priority ? renderQueue.unshift(n) : renderQueue.push(n);
}

function pumpQueue() {
  while (activeLanes < MAX_LANES && renderQueue.length > 0) {
    const n    = renderQueue.shift();
    const slot = document.getElementById(`p${n}`);
    if (!slot || slot.dataset.rendered) { inQueue.delete(n); continue; }
    activeLanes++;
    doRender(n, slot).finally(() => {
      activeLanes--;
      inQueue.delete(n);
      pumpQueue(); // เปิด lane ใหม่ทันทีที่ว่าง
    });
  }
  // ถ้าคิวว่างแล้วให้ render background ต่อ
  if (renderQueue.length === 0 && activeLanes === 0) {
    setTimeout(bgRender, 200);
  }
}

async function doRender(n, slot) {
  try {
    const page  = await pdfDoc.getPage(n);
    // DPR 1.5 เร็วกว่า 2 ชัดพอสำหรับ retina
    const dpr   = Math.min(window.devicePixelRatio || 1, 1.5);
    const scale = (PAGE_W / page.getViewport({ scale: 1 }).width) * dpr;
    const vp    = page.getViewport({ scale });
    const cv    = document.createElement('canvas');
    cv.width    = Math.round(vp.width);
    cv.height   = Math.round(vp.height);
    await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
    slot.innerHTML = '';
    slot.appendChild(cv);
    slot.dataset.rendered = '1';
  } catch (e) {
    slot.innerHTML = '';
    slot.dataset.rendered = 'err';
  }
}

function bgRender() {
  let kicked = 0;
  while (bgIdx <= totalPages && kicked < MAX_LANES) {
    const n    = bgIdx++;
    const slot = document.getElementById(`p${n}`);
    if (slot && !slot.dataset.rendered && !inQueue.has(n)) {
      enqueue(n); kicked++;
    }
  }
  if (kicked > 0) pumpQueue();
}

// ── Resize ────────────────────────────────────────────────────────────────────
async function rebuildOnResize() {
  if (!pdfDoc) return;
  renderQueue = []; bgIdx = 1;
  await calcSize();
  buildFlipbook();
  renderBatch(1, 6);
}

// ── Zoom (double-click) ───────────────────────────────────────────────────────
function setupZoom() {
  $('#book-wrap').off('dblclick').on('dblclick', async function (e) {
    const fb = $('#flipbook');
    if (!fb.data('turn')) return;
    const page = fb.turn('page');
    const rect = document.getElementById('flipbook').getBoundingClientRect();
    const side = (e.clientX - rect.left) < BOOK_W / 2 ? 'left' : 'right';
    let pdfPage = side === 'right' ? page : page - 1;
    pdfPage = Math.max(1, Math.min(pdfPage, totalPages));
    const hPage  = await pdfDoc.getPage(pdfPage);
    const hScale = (PAGE_W * 2.8) / hPage.getViewport({ scale: 1 }).width;
    const hVp    = hPage.getViewport({ scale: hScale });
    const zc     = document.getElementById('zoom-canvas');
    zc.width  = Math.round(hVp.width);
    zc.height = Math.round(hVp.height);
    await hPage.render({ canvasContext: zc.getContext('2d'), viewport: hVp }).promise;
    document.getElementById('zoom-wrap').classList.add('show');
  });
}
function closeZoom() { document.getElementById('zoom-wrap').classList.remove('show'); }
document.getElementById('zoom-wrap').addEventListener('click', e => {
  if (e.target.id === 'zoom-wrap') closeZoom();
});

// ── Helpers ───────────────────────────────────────────────────────────────────
function show(s) {
  document.getElementById('screen-loading').style.display = s === 'loading' ? 'flex'  : 'none';
  document.getElementById('screen-error').style.display   = s === 'error'   ? 'flex'  : 'none';
  document.getElementById('screen-viewer').style.display  = s === 'viewer'  ? 'flex'  : 'none';
}
function setProgress(msg, pct) {
  if (msg) document.getElementById('prog-label').textContent = msg;
  document.getElementById('prog-bar').style.width = ~~pct + '%';
}
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
</script>
</body>
</html>
